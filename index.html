<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sleeved</title>
<meta name="description" content="A shared tracker for a group's trading card collection: orders, who owes what, deliveries and prices.">
<meta name="theme-color" content="#131a33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sleeved">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
/* Sleeved. Layout idea: a phone-width binder. The collection value sits on a dark,
   foil-edged panel with a hand of your top cards; holdings are card-shaped pockets;
   everything else stays quiet so the cards carry the colour. */
:root {
  --bg: #edeff6;
  --surface: #ffffff;
  --surface-2: #f2f4fa;
  --ink: #10162f;
  --ink-2: #454c6c;
  --ink-3: #6f7694;
  --line: #dadeeb;
  --accent: #f6b500;
  --accent-ink: #1c1500;
  --accent-text: #7a5600;
  --up: #0a7d50;
  --down: #c2334b;
  --signal: #5a48cf;
  --info: #1f66bd;
  --tab-on: #10162f;
  --tab-on-ink: #ffffff;
  --shadow: 0 1px 0 rgb(16 22 47 / 0.04), 0 14px 28px -22px rgb(16 22 47 / 0.45);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #c82333;
  --foil: linear-gradient(110deg, #ff8ab5, #ffd36b 22%, #7df2c0 44%, #6fb8ff 66%, #c59bff 84%, #ff8ab5);
  --display: "Bricolage Grotesque", "Avenir Next Condensed", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 16px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0e1d; --surface: #131a33; --surface-2: #1b2444; --ink: #eef1fa; --ink-2: #b9bfd8; --ink-3: #8b93b3; --line: #283256;
    --accent: #ffc531; --accent-ink: #1c1500; --accent-text: #ffc531;
    --up: #3dd68c; --down: #ff7088; --signal: #a79dfa; --info: #6fb0ff;
    --tab-on: #ffc531; --tab-on-ink: #1c1500;
    --shadow: 0 1px 0 rgb(255 255 255 / 0.03) inset, 0 16px 30px -24px rgb(0 0 0 / 0.9);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e84855;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0e1d; --surface: #131a33; --surface-2: #1b2444; --ink: #eef1fa; --ink-2: #b9bfd8; --ink-3: #8b93b3; --line: #283256;
  --accent: #ffc531; --accent-ink: #1c1500; --accent-text: #ffc531;
  --up: #3dd68c; --down: #ff7088; --signal: #a79dfa; --info: #6fb0ff;
  --tab-on: #ffc531; --tab-on-ink: #1c1500;
  --shadow: 0 1px 0 rgb(255 255 255 / 0.03) inset, 0 16px 30px -24px rgb(0 0 0 / 0.9);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e84855;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.45 var(--body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto 0; height: 340px; pointer-events: none; z-index: 0; background: radial-gradient(70% 100% at 50% 0%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%); }
body.has-sheet { overflow: hidden; }
h1, h2, h3, p, dl, dd, ul, figure { margin: 0; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; letter-spacing: -0.015em; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }
.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mute { color: var(--ink-3); }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--ink-2); }
.grow { flex: 1; }

#app { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; padding: 0 16px calc(112px + env(safe-area-inset-bottom)); }

/* top bar */
.top { display: flex; align-items: center; gap: 10px; padding: calc(12px + env(safe-area-inset-top)) 0 12px; position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 82%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
.brand { display: flex; align-items: center; gap: 9px; font: 800 22px/1 var(--display); letter-spacing: -0.03em; }
.brand i { width: 18px; height: 25px; border-radius: 4px; background: var(--accent); box-shadow: 4px 3px 0 -1px var(--ink); display: block; transform: rotate(-8deg); margin-right: 2px; }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--ink-3); margin-left: auto; white-space: nowrap; min-width: 0; overflow: hidden; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); flex: none; }
.sync.ok i { background: var(--up); } .sync.bad i { background: var(--down); } .sync.bad { color: var(--down); } .sync.busy i { background: var(--accent); }
.group-pill { padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); max-width: 170px; min-height: 34px; }
.group-pill:hover { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
.group-pill.bad { color: var(--down); border-color: color-mix(in srgb, var(--down) 45%, var(--line)); }
.group-pill-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 700; }
.group-pill-chev { flex: none; opacity: 0.7; }
@media (max-width: 400px) {
  .group-pill { max-width: 120px; padding: 6px 8px; }
  .brand { font-size: 19px; gap: 7px; }
}
.icon-btn { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 13px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); flex: none; padding: 0; }
.icon-btn.on { color: var(--accent-text); border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); background: color-mix(in srgb, var(--accent) 14%, var(--surface)); }
.icon-btn.acc { background: var(--accent); color: var(--accent-ink); border-color: transparent; box-shadow: 0 6px 14px -8px var(--accent); }
.row .icon-btn, .detail-head .icon-btn { border-color: transparent; background: transparent; }

/* floating tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 6; pointer-events: none; padding: 0 12px; }
.tabs div { pointer-events: auto; max-width: 460px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; padding: 6px; border-radius: 24px; border: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 86%, transparent); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); box-shadow: 0 18px 40px -18px rgb(8 12 30 / 0.55); }
.tabs a { display: grid; justify-items: center; gap: 1px; padding: 7px 2px 6px; font-size: 10.5px; font-weight: 700; color: var(--ink-3); border-radius: 18px; min-width: 0; }
.tabs a span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tabs a.on { background: var(--tab-on); color: var(--tab-on-ink); }

/* buttons, chips */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; padding: 0 15px; border-radius: 13px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 14px; white-space: nowrap; }
.btn svg { width: 17px; height: 17px; flex: none; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; box-shadow: 0 8px 16px -10px var(--accent); }
.btn.danger { color: var(--down); }
.btn.sm { min-height: 34px; padding: 0 11px; font-size: 13px; border-radius: 10px; }
.btn:disabled { opacity: 0.5; }
.btn-row { display: flex; gap: 8px; align-items: center; }
.btn-row.wrap { flex-wrap: wrap; margin-top: 14px; }
.link { background: none; border: 0; padding: 0; color: var(--accent-text); font-weight: 600; text-decoration: underline; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; line-height: 1.5; padding: 1px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.chip svg { width: 12px; height: 12px; }
.chip.ok { color: var(--up); background: color-mix(in srgb, var(--up) 13%, var(--surface)); border-color: transparent; }
.chip.bad { color: var(--down); background: color-mix(in srgb, var(--down) 13%, var(--surface)); border-color: transparent; }
.chip.info { color: var(--info); background: color-mix(in srgb, var(--info) 13%, var(--surface)); border-color: transparent; }
.chip.sig { color: var(--signal); background: color-mix(in srgb, var(--signal) 14%, var(--surface)); border-color: transparent; }
.chip.acc { color: var(--accent-ink); background: var(--accent); border-color: transparent; }
p.chip { display: flex; border-radius: 12px; padding: 8px 12px; line-height: 1.35; margin-bottom: 10px; }
.chip-btn { padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 700; color: var(--ink-2); white-space: nowrap; }
.chip-btn.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.delta { font-weight: 700; font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; padding: 1px 7px; border-radius: 999px; background: var(--surface-2); }
.delta.up { background: color-mix(in srgb, var(--up) 13%, var(--surface)); }
.delta.down { background: color-mix(in srgb, var(--down) 13%, var(--surface)); }
.delta.up::before { content: "▲ "; font-size: 0.66em; vertical-align: 0.14em; }
.delta.down::before { content: "▼ "; font-size: 0.66em; vertical-align: 0.14em; }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 9px; font-size: 13px; font-weight: 700; color: var(--ink-3); white-space: nowrap; display: inline-grid; place-items: center; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgb(10 16 40 / 0.18); }
.seg.icons button { padding: 5px 8px; }
.seg.icons svg { width: 18px; height: 18px; }

/* banners */
.banner { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 14px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); margin-bottom: 12px; box-shadow: var(--shadow); }
.banner.demo { border-style: dashed; border-color: var(--ink-3); background: transparent; box-shadow: none; }
.banner p { color: var(--ink-2); font-size: 13.5px; }
.banner > div:first-child { flex: 1 1 220px; }

/* hero: always dark, with a foil edge */
.hero { --line: #2a3560; --ink-3: #9aa3c6; --surface: #121a38; --s1: #5aa2ff; color: #f3f5ff; border-radius: 24px; border: 1.5px solid transparent; overflow: hidden;
  background: radial-gradient(90% 70% at 100% 0%, rgb(255 197 49 / 0.24), transparent 62%) padding-box, radial-gradient(80% 90% at 0% 100%, rgb(27 175 122 / 0.22), transparent 62%) padding-box, linear-gradient(#121a38, #121a38) padding-box, var(--foil) border-box;
  background-size: auto, auto, auto, 240% 100%; animation: foil 2.4s ease-out 1 both; box-shadow: 0 26px 40px -30px rgb(8 12 30 / 0.9); }
@keyframes foil { from { background-position: 0 0, 0 0, 0 0, 100% 0; } to { background-position: 0 0, 0 0, 0 0, 0 0; } }
.hero-top { display: flex; justify-content: space-between; gap: 12px; padding: 14px 18px 0; font-size: 12.5px; font-weight: 700; color: #aab2d6; }
.hero-main { padding: 10px 18px 4px; }
.hero-label { font-size: 13px; font-weight: 600; color: #aab2d6; }
.hero-value { font: 800 46px/1.02 var(--display); letter-spacing: -0.035em; font-variant-numeric: tabular-nums; margin: 2px 0 8px; overflow-wrap: anywhere; }
.hero-sub { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13.5px; color: #c3c9e6; }
.pill { font-weight: 700; padding: 3px 10px; border-radius: 999px; background: rgb(255 255 255 / 0.1); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill.up { background: rgb(61 214 140 / 0.18); color: #74f0b3; }
.pill.down { background: rgb(255 112 136 / 0.2); color: #ffa3b3; }
.fan { position: relative; height: 122px; margin: 14px 0 2px; }
.fan-card { --o: calc(var(--i) - (var(--n) - 1) / 2); position: absolute; left: 50%; top: 10px; width: 70px; margin-left: -35px; transform: translateX(calc(var(--o) * 50px)) translateY(calc(var(--o) * var(--o) * 4px)) rotate(calc(var(--o) * 7deg)); transform-origin: 50% 120%; transition: transform 0.18s ease; z-index: calc(10 + var(--i)); }
.fan-card:hover, .fan-card:focus-visible { transform: translateX(calc(var(--o) * 50px)) translateY(-8px) rotate(calc(var(--o) * 7deg)); z-index: 30; }
.fan-card .art { box-shadow: 0 10px 18px -8px rgb(0 0 0 / 0.75), 0 0 0 1px rgb(255 255 255 / 0.14); }
.hero-chart { padding: 4px 8px 0; }
.hero .seg { background: rgb(255 255 255 / 0.07); border-color: rgb(255 255 255 / 0.1); }
.hero .seg button { color: #aab2d6; }
.hero .seg button.on { background: rgb(255 255 255 / 0.16); color: #fff; box-shadow: none; }
.hero .legend { color: #c3c9e6; }
.hero .chart .tick { fill: #9aa3c6; }
.hero .area { opacity: 0.16; }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); margin-top: 12px; }
.stats3 div { padding: 12px 12px 14px; min-width: 0; }
.stats3 div + div { border-left: 1px solid var(--line); }
.hero dt { color: #aab2d6; }
.hero dd.up { color: #74f0b3; } .hero dd.down { color: #ffa3b3; } .hero dd.flat { color: #f3f5ff; }
dt { font-size: 12px; color: var(--ink-3); font-weight: 500; line-height: 1.3; }
dd { font: 700 17px/1.3 var(--display); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

/* charts */
.chart { position: relative; touch-action: pan-y; }
.chart svg { display: block; width: 100%; height: 100%; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .tick { fill: var(--ink-3); font: 500 11px var(--body); }
.chart .ln { fill: none; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
.chart .ln.thin { stroke-width: 1.6; }
.chart .ln.mut { stroke-dasharray: 2 5; }
.chart .area { opacity: 0.1; stroke: none; }
.chart .end { stroke: var(--surface); stroke-width: 2; }
.chart .cross { stroke: var(--ink-3); stroke-width: 1; }
.s1 { stroke: var(--s1); fill: var(--s1); } .s2 { stroke: var(--s2); fill: var(--s2); } .s3 { stroke: var(--s3); fill: var(--s3); } .mut { stroke: var(--ink-3); fill: var(--ink-3); }
.chart-empty { display: grid; place-items: center; height: 100%; color: var(--ink-3); font-size: 13px; }
.tip { position: absolute; top: 0; pointer-events: none; background: #f3f5ff; color: #10162f; border-radius: 10px; padding: 6px 9px; font-size: 12px; min-width: 124px; z-index: 2; box-shadow: 0 8px 18px -8px rgb(0 0 0 / 0.5); }
.tip-date { font-weight: 700; margin-bottom: 2px; }
.tip-row { display: grid; grid-template-columns: auto 1fr auto; gap: 6px; align-items: center; }
.tip-row b { font-variant-numeric: tabular-nums; }
.chart-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 6px 10px 0; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); font-weight: 500; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.key { display: inline-block; width: 10px; height: 10px; border-radius: 3px; flex: none; background: var(--ink-3); }
.key.s1 { background: var(--s1); } .key.s2 { background: var(--s2); } .key.s3 { background: var(--s3); } .key.mut { background: var(--ink-3); }
.g0 { --g: #7f86a6; } .g1 { --g: var(--s1); } .g2 { --g: var(--s2); } .g3 { --g: var(--s3); } .g4 { --g: var(--s4); } .g5 { --g: var(--s5); } .g6 { --g: var(--s6); } .g7 { --g: var(--s7); } .g8 { --g: var(--s8); }
.gdot .key, .segbar i { background: var(--g); }
.spark path { fill: none; stroke-width: 1.7; stroke-linejoin: round; stroke-linecap: round; stroke: var(--ink-3); }
.spark circle { fill: var(--ink-3); }
.spark.up path { stroke: var(--up); } .spark.up circle { fill: var(--up); }
.spark.down path { stroke: var(--down); } .spark.down circle { fill: var(--down); }
.toggles { display: flex; gap: 16px; flex-wrap: wrap; padding: 8px 12px 12px; font-size: 13px; color: var(--ink-2); }
.toggles label { display: inline-flex; gap: 6px; align-items: center; }

/* card art: a picture, or a drawn card when there is none */
.art { position: relative; display: block; width: 44px; aspect-ratio: 5 / 7; border-radius: 9% / 6.5%; overflow: hidden; flex: none; isolation: isolate;
  background: linear-gradient(155deg, color-mix(in srgb, var(--g) 78%, #fff) 0%, var(--g) 46%, color-mix(in srgb, var(--g) 58%, #0a1030) 100%); box-shadow: 0 0 0 1px rgb(16 22 47 / 0.12), 0 6px 12px -8px rgb(16 22 47 / 0.6); }
.art::after { content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none; background: linear-gradient(115deg, transparent 38%, rgb(255 255 255 / 0.34) 48%, transparent 58%); mix-blend-mode: screen; }
.art.has-img::after { opacity: 0.35; }
.art .ph { position: absolute; inset: 7%; border-radius: 7% / 5%; border: 1.5px solid rgb(255 255 255 / 0.42); display: grid; place-items: center; align-content: center; gap: 4%; color: rgb(255 255 255 / 0.95); }
.art .ph svg { width: 46%; height: auto; }
.art .ph em { font: 800 normal 10px/1 var(--display); letter-spacing: 0.02em; opacity: 0.92; }
.art.k-sealed .ph { border-radius: 4%; border-style: solid; border-top-width: 0.6em; border-top-color: rgb(255 255 255 / 0.5); }
.art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
.art.has-img.k-sealed, .art.has-img.k-other { background: #fff; }
.art.k-sealed img, .art.k-other img { object-fit: contain; padding: 4%; }
.art.k-graded { box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--ink-3), 0 6px 12px -8px rgb(16 22 47 / 0.6); }
.slab-tag { position: absolute; left: 0; right: 0; top: 0; z-index: 3; height: 20%; min-height: 12px; display: flex; align-items: center; justify-content: space-between; gap: 4px; padding: 0 9%; background: #fff; color: #10162f; font: 800 8px/1 var(--display); border-bottom: 2px solid #c2334b; }
.slab-tag b { font-size: 1.35em; }
.art.xs { width: 22px; } .art.xs .ph em, .art.xs .slab-tag { display: none; } .art.xs .ph { border-width: 1px; }
.art.sm .ph em { font-size: 8px; } .art.sm .slab-tag { font-size: 6.5px; }
.art.md { width: 100%; } .art.md .ph em { font-size: 13px; } .art.md .slab-tag { font-size: 10px; }
.art.lg { width: 118px; } .art.lg .ph em { font-size: 16px; } .art.lg .slab-tag { font-size: 12px; }
.art-btn { border: 0; background: none; padding: 0; flex: none; border-radius: 10px; }

/* sections, lists, rows */
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 28px 2px 10px; }
.head h2 { font-size: 19px; font-weight: 750; }
.head a { font-size: 13px; font-weight: 700; color: var(--accent-text); text-decoration: underline; text-underline-offset: 3px; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); }
.list.flush { border: 0; border-radius: 0; margin: 0 -14px; background: none; box-shadow: none; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; width: 100%; text-align: left; background: none; border: 0; }
.row + .row, .att + .att, .row + .att { border-top: 1px solid var(--line); }
.row-main { flex: 1; min-width: 0; display: grid; gap: 2px; }
.row-main strong { font-weight: 650; font-size: 14.5px; line-height: 1.25; overflow-wrap: anywhere; }
.row-main strong a { text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
